<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Clip - 必要なページだけ抽出</title>
  <meta name="description" content="PDFから必要なページだけを選んで、端末内だけで安全に抽出・ダウンロードできる無料ツールです。" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">✂</div>
      <div>
        <h1>PDF Clip</h1>
        <p>必要なページだけを、安全に書き出し</p>
      </div>
    </div>
    <div class="privacy-badge">🛡 サーバー送信なし・端末内で完結</div>
  </header>

  <main class="page">
    <section class="upload-card" id="dropZone">
      <input type="file" id="fileInput" accept="application/pdf" hidden />
      <div class="upload-icon">PDF</div>
      <div class="upload-copy">
        <h2>PDFをドロップ</h2>
        <p>またはクリックしてPDFを選択</p>
      </div>
      <button id="chooseButton" class="primary">PDFを選択</button>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="file-toolbar card">
        <div class="file-meta">
          <div class="file-icon">📄</div>
          <div>
            <h2 id="fileName">sample.pdf</h2>
            <p><span id="pageCount">0</span>ページ中 <strong id="selectedCount">0</strong>ページ選択中</p>
          </div>
        </div>

        <div class="controls">
          <button data-action="all">すべて選択</button>
          <button data-action="none">選択解除</button>
          <button data-action="odd">奇数</button>
          <button data-action="even">偶数</button>
          <button data-action="invert">反転</button>
          <div class="range-row">
            <input id="rangeInput" type="text" placeholder="例: 1-3, 5" />
            <button id="rangeButton">指定</button>
          </div>
        </div>

        <button id="downloadButton" class="download-btn" disabled>⬇ <span id="downloadLabel">ページを選択してください</span></button>
      </div>

      <div class="pages-card card">
        <div class="section-head">
          <h3>▦ ページ一覧 <span>（クリックで選択 / 選択解除）</span></h3>
          <p>虫眼鏡で拡大プレビュー</p>
        </div>
        <div id="pageGrid" class="page-grid"></div>
      </div>
    </section>
  </main>

  <dialog id="previewDialog">
    <button id="closePreview" class="close-preview">×</button>
    <canvas id="previewCanvas"></canvas>
    <div id="previewCaption"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
